name: Node Unit Tests
on: [push, pull_request]
permissions: read-all
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        node: ["16", "18", "20", "22", "24", "26"]
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Do *not* use cache (see: tanstack cache poisoning vuln)
          # cache: npm
      - run: npm install
      - run: npm test
env:
  YARN_GPG: no
